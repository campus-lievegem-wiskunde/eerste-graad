<!DOCTYPE html>
<html lang="nl" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oplossingssleutel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../gedeeld/stijl.css">
<link rel="stylesheet" href="sleutel.css">
<link rel="icon" href="../gedeeld/img/beeldmerk.png">
</head>
<body data-site="sleutel">
<main class="sleutel">
  <div class="balk" id="balk" hidden>
    <div class="balk-rij">
      <button type="button" class="btn" id="druk">Afdrukken of bewaren als pdf</button>
      <span class="mini">Kies in het afdrukvenster <b>Opslaan als PDF</b> om een pdf te maken. Elk hoofdstuk begint op een nieuwe bladzijde.</span>
    </div>
    <fieldset class="balk-kies" id="kies"><legend>Wat komt in de pdf?</legend></fieldset>
  </div>
  <div id="app"></div>
</main>
<script type="module" src="../gedeeld/aanmelden.js"></script>
<script type="module" src="sleutel.js"></script>
</body></html>
